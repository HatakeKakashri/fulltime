services:
  postgres:
    image: postgres:16-alpine
    container_name: fulltime-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: fulltime
      POSTGRES_PASSWORD: fulltime
      POSTGRES_DB: fulltime
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
